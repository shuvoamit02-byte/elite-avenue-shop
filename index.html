<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Avenue BD — Luxury Fragrance</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { background-color: #030712; font-family: 'Plus Jakarta Sans', sans-serif; color: #f3f4f6; }</style>
</head>
<body class="min-h-screen">
    <nav class="border-b border-gray-800 backdrop-blur-md sticky top-0 z-50 bg-gray-950/80">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-widest text-amber-400">ELITE AVENUE BD</h1>
            <a href="admin.html" class="text-xs bg-amber-500/10 text-amber-400 border border-amber-500/30 px-3 py-1.5 rounded-full">Admin Portal</a>
        </div>
    </nav>
    <header class="py-16 text-center px-4">
        <h2 class="text-3xl md:text-4xl font-light mb-3 text-white">Quiet Luxury & Signature Scents</h2>
        <p class="text-gray-400 text-sm max-w-md mx-auto">Curated collection of high-end fragrances tailored for refined elegance.</p>
    </header>
    <main class="max-w-7xl mx-auto px-6 pb-20">
        <h3 class="text-lg font-semibold mb-6 border-l-2 border-amber-400 pl-3 text-amber-300">Featured Collections</h3>
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <p class="text-gray-500 text-sm">Loading products...</p>
        </div>
    </main>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        const db = getFirestore(initializeApp({
            apiKey: "AIzaSyBmd6TVKotzSMiUBATw8POCPj9Dc98ct4o",
            authDomain: "elite-avenue-shop.firebaseapp.com",
            projectId: "elite-avenue-shop",
            storageBucket: "elite-avenue-shop.firebasestorage.app",
            messagingSenderId: "929865281991",
            appId: "1:929865281991:web:2a4ce78b0e3106087369e2"
        }));
        async function load() {
            const grid = document.getElementById('productGrid');
            try {
                const snap = await getDocs(collection(db, "products"));
                if (snap.empty) { grid.innerHTML = `<p class="text-gray-500 text-sm col-span-full text-center py-10">No products found.</p>`; return; }
                grid.innerHTML = "";
                snap.forEach(d => {
                    const p = d.data();
                    grid.innerHTML += `<div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 flex flex-col justify-between shadow-xl"><div><div class="w-full h-56 bg-gray-950 rounded-xl overflow-hidden mb-4"><img src="${p.image || 'https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=500'}" class="w-full h-full object-cover"></div><span class="text-xs uppercase text-amber-400 bg-amber-500/10 px-2.5 py-1 rounded-md inline-block mb-2">${p.category || 'General'}</span><h4 class="font-medium text-white">${p.name}</h4></div><div class="flex items-center justify-between mt-4 pt-4 border-t border-gray-800"><span class="font-bold text-amber-300">${p.price}</span><button onclick="alert('Order placed!')" class="bg-amber-400 text-gray-950 text-xs font-semibold px-4 py-2 rounded-lg">Order Now</button></div></div>`;
                });
            } catch(e) { grid.innerHTML = `<p class="text-red-400 text-sm">Error loading.</p>`; }
        }
        load();
    </script>
</body>
</html>
