<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELITE AVENUE BD — Master Admin Panel</title>
    <style>
        :root {
            --bg-color: #0f1015;
            --card-bg: #181a20;
            --accent-gold: #d4af37;
            --text-main: #f3f4f6;
            --border-color: #2a2d37;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 25px; }
        .container { max-width: 1100px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 30px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        header h1 { color: var(--accent-gold); font-size: 28px; letter-spacing: 1px; }
        header p { color: #9ca3af; font-size: 14px; margin-top: 5px; }

        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        @media(max-width: 768px) { .dashboard-grid { grid-template-columns: 1fr; } }

        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 20px; }
        .card h2 { color: var(--accent-gold); font-size: 18px; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }

        label { display: block; font-size: 13px; color: #9ca3af; margin-top: 12px; margin-bottom: 4px; }
        input, select, textarea { width: 100%; padding: 10px; background: #0f1015; border: 1px solid var(--border-color); color: #fff; border-radius: 6px; outline: none; font-size: 14px; }
        input:focus, select:focus { border-color: var(--accent-gold); }

        .btn { background: var(--accent-gold); color: #000; font-weight: bold; padding: 12px; border: none; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 15px; font-size: 14px; transition: 0.2s; }
        .btn:hover { background: #e6c555; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid var(--border-color); }
        th { color: var(--accent-gold); background: #121319; }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; display: inline-block; }
        .badge-pending { background: #d97706; color: #fff; }
        .badge-completed { background: #059669; color: #fff; }
        .badge-cancelled { background: #dc2626; color: #fff; }

        .status-select { padding: 4px; font-size: 12px; width: auto; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>ELITE AVENUE BD — Master Control Panel</h1>
        <p>Real-Time Store Management & Live Order Tracking System</p>
    </header>

    <!-- Form Section -->
    <div class="dashboard-grid">
        <!-- Site & Theme Settings -->
        <div class="card">
            <h2>🎨 Theme & Announcement Control</h2>
            <label>Site Background Color:</label>
            <input type="color" id="bgColor" value="#0f1015">

            <label>Promo Banner Text:</label>
            <input type="text" id="bannerText" placeholder="e.g. Special Offer: 20% Discount on Perfumes!">

            <label>Promo Banner Status:</label>
            <select id="showBanner">
                <option value="true">Enable Banner</option>
                <option value="false">Disable Banner</option>
            </select>

            <button class="btn" onclick="saveSettings()">Save Configuration</button>
        </div>

        <!-- Add New Product -->
        <div class="card">
            <h2>🛍️ Add New Product</h2>
            <label>Product Title:</label>
            <input type="text" id="prodName" placeholder="e.g. Blue De Chanel 100ml">

            <label>Price (BDT):</label>
            <input type="number" id="prodPrice" placeholder="e.g. 4500">

            <label>Image Direct Link (URL):</label>
            <input type="text" id="prodImg" placeholder="https://example.com/image.jpg">

            <label>Product Category:</label>
            <select id="prodCategory">
                <option value="Perfume">Perfume</option>
                <option value="Watch">Wristwatch</option>
                <option value="Accessories">Lifestyle Accessories</option>
            </select>

            <button class="btn" onclick="addProduct()">Publish Product</button>
        </div>
    </div>

    <!-- Live Customer Orders Table -->
    <div class="card">
        <h2>📦 Live Customer Orders (Real-Time)</h2>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Customer Details</th>
                        <th>Product & Price</th>
                        <th>Address</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody">
                    <tr>
                        <td colspan="6" style="text-align: center; color: #9ca3af;">Loading orders data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
