<script>

function trk(){ov(`<button class=x onclick=cl()>✕</button><h3>Track order</h3><input id=ti placeholder="Order number, e.g. EA2511031234"><input id=tp placeholder="Mobile number used for the order" inputmode=tel><button class=btn onclick=trkGo()>Track</button><div id=tr></div>`)}
async function trkGo(){const id=$("#ti").value.trim().toUpperCase(),p=$("#tp").value.trim(),dg=s=>String(s).replace(/\D/g,"");if(!id||!p)return alert("Enter order number and mobile number");let o=null;try{o=await api("track",{id,p})}catch(e){o=S.orders.find(x=>x.id==id&&dg(x.p)==dg(p))||null}
$("#tr").innerHTML=o&&o.id?`<div class=oc><b>${esc(o.id)}</b> · ${esc(o.date)}<br>${o.st=="Declined"?"<b>Declined</b>":ST.filter(s=>s!="Declined").map((s,i,a)=>`<span class="chip${a.indexOf(o.st)>=i?" on":""}">${s}</span>`).join(" ")}<br>${o.items.map(x=>`${esc(x.n)} ${esc(x.size)} ${esc(x.color)} ×${x.qty}`).join("<br>")}<br>${esc(o.a)} (${esc(o.area)})<br><b>Total ${money(o.total)}</b> · Cash on delivery</div>`:"<p>Order not found. Check the number and mobile.</p>"}
function colv(){return `<section class="sec grid"><div class=sh><h3>${esc(ttl(V.c))}</h3><a class=sa onclick="go()">← Home</a></div><div class=row>${lst(V.c).map(card).join("")||"<p>No products yet.</p>"}</div></section>`}
function foot(){const c=S.cfg;return `<footer><div class=fg><div><h5>${esc(c.name)}</h5><p>${esc(c.about||"Premium menswear from Bangladesh.")}</p></div><div><h5>Information</h5><p><a onclick="col('best')">Best Selling</a></p><p><a onclick="col('new')">New Arrivals</a></p><p><a onclick="menu()">All Collections</a></p></div><div><h5>Contact</h5><p>${esc(c.addr)}</p><p>${esc(c.ph)}</p><p>Worktime: ${esc(c.hrs)}</p></div><div><h5>Follow us</h5><p><a href="${esc(c.fb)}" target=_blank>Facebook</a></p><p><a href="https://wa.me/${esc(c.wa)}" target=_blank>WhatsApp</a></p><p>Payment: Cash on Delivery</p></div></div><p class=cp>© ${new Date().getFullYear()} ${esc(c.name)}</p></footer><a class=wa href="https://wa.me/${esc(c.wa)}" target=_blank aria-label=WhatsApp>💬</a>`}
function ov(h,l){$("#ov").innerHTML=`<div class=bk onclick=cl()></div><div class="pn${l?" l":""}">${h}</div>`;$("#ov").className="on"}
function cl(){$("#ov").className="";$("#ov").innerHTML=""}
function menu(){ov(`<button class=x onclick=cl()>✕</button><h3>All Collections</h3>${["best","new"].concat(S.cats.map(k=>k.id)).map(id=>`<p><a onclick="col('${id}')">${esc(ttl(id))}</a></p>`).join("")}`,1)}
const cur=()=>S.prods.find(x=>x.id==sel.id);
function openP(id){sel={id,size:"",color:"",qty:1};const p=cur(),cols=(p.col||"").split(",").map(s=>s.trim()).filter(Boolean),sz=sizes(p),r=rvs(p),hd=(p.szh||H).split(",");
ov(`<button class=x onclick=cl()>✕</button><div class=gal>${ph(p)}<div class=th>${(p.imgs||[]).map(u=>`<img src="${esc(u)}" data-u="${esc(u)}" onclick="sw(this)">`).join("")}</div></div><h3>${esc(p.n)} <button class="ic" data-i="${p.id}" onclick="wl('${p.id}')">${W().includes(p.id)?"♥":"♡"}</button></h3><div class=pp><b>${money(pr(p))}</b>${+p.o>0&&+p.o<+p.p?`<s>${money(p.p)}</s>`:""} ${avg(p)?`· ★ ${avg(p)} (${r.length})`:""}</div>
${sz.length?`<label>Size</label><div class=chips>${sz.map(a=>`<span class=chip data-k=size data-v="${esc(a[0])}" onclick=pk(this)>${esc(a[0])}</span>`).join("")}</div>`:""}
${cols.length?`<label>Color</label><div class=chips>${cols.map(c=>`<span class=chip data-k=color data-v="${esc(c)}" onclick=pk(this)>${esc(c)}</span>`).join("")}</div>`:""}
<label>Quantity</label><div class=qt><button onclick=sq(-1)>−</button> <span id=sq>1</span> <button onclick=sq(1)>+</button> <small>(${p.q} in stock)</small></div><br>
${+p.q>0?`<button class=btn onclick=addC(0)>Add to cart</button> <button class=btn style="background:var(--ac2)" onclick=addC(1)>Buy now</button>`:"<em>Sold out</em>"}
<h4>Details</h4><p>${esc(p.d).replace(/\n/g,"<br>")}</p><h4>Reviews</h4>${r.map(a=>`<p><b>${esc(a[0])}</b> ${"★".repeat(+a[1]||5)}<br>${esc(a[2])}</p>`).join("")||"<p>No reviews yet.</p>"}
${sz.length?`<h4>Size chart</h4><div style="overflow-x:auto"><table class=tbl><tr>${hd.map(h=>`<th>${esc(h)}</th>`).join("")}</tr>${sz.map(a=>`<tr>${a.map(x=>`<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</table></div>`:""}<h4>You may also like</h4><div class=row>${sug(p).map(card).join("")}</div>`)}
const pk=e=>{sel[e.dataset.k]=e.dataset.v;[...e.parentNode.children].forEach(c=>c.classList.remove("on"));e.classList.add("on")};
const sw=e=>{const m=$(".gal .ph");m.style.backgroundImage=`url('${e.dataset.u}')`;m.textContent=""};
const sq=d=>{sel.qty=Math.max(1,sel.qty+d);$("#sq").textContent=sel.qty};
function addC(buy){const p=cur(),cols=(p.col||"").trim(),sz=sizes(p);if(sz.length&&!sel.size)return alert("Please select a size");if(cols&&!sel.color)return alert("Please select a color");
const k=cart.find(i=>i.id==p.id&&i.size==sel.size&&i.color==sel.color);k?k.qty+=sel.qty:cart.push({id:p.id,n:p.n,size:sel.size,color:sel.color,pr:pr(p),qty:sel.qty});cc();buy?cartOv():toast("Added to cart ✓")}
const cc=()=>{const n=cart.reduce((s,i)=>s+i.qty,0);["#cc","#cc2"].forEach(q=>{const e=$(q);if(e)e.textContent=n})};
const sub=()=>cart.reduce((s,i)=>s+i.pr*i.qty,0),ship=()=>{const r=document.querySelector("input[name=ar]:checked");return r&&r.value=="out"?+S.cfg.dOut:+S.cfg.dIn};
function cartOv(){const c=S.cfg;ov(`<button class=x onclick=cl()>✕</button><h3>Your Cart</h3>${cart.length?cart.map((i,k)=>`<div class=ci><div><b>${esc(i.n)}</b><small>${esc(i.size)} ${esc(i.color)}</small><span>${money(i.pr)}</span></div><div class=qt><button onclick="cq(${k},-1)">−</button> ${i.qty} <button onclick="cq(${k},1)">+</button></div></div>`).join("")+`<h4>Delivery details</h4><input id=cn placeholder="Full name"><input id=cp placeholder="Mobile number" inputmode=tel><textarea id=ca placeholder="Full address"></textarea>
<label><input type=radio name=ar value=in checked onchange=upd()> Inside Dhaka ${money(c.dIn)}</label><label><input type=radio name=ar value=out onchange=upd()> Outside Dhaka ${money(c.dOut)}</label>
<div class=cod><b>Cash on Delivery</b><br>${esc(c.note)} Delivery charge must be paid in advance: ${money(c.dOut)} outside Dhaka, ${money(c.dIn)} inside Dhaka.</div>
<div class=sm>Subtotal<span>${money(sub())}</span></div><div class=sm>Delivery<span id=ds></span></div><div class=sm><b>Total</b><b id=tt></b></div><br><button class=btn onclick=place() style="width:100%">Place order</button>`:"<p>Your cart is empty.</p>"}<h4>Suggested for you</h4><div class=row>${sug(S.prods.find(x=>cart.length&&x.id==cart[cart.length-1].id)).map(card).join("")}</div>`);if(cart.length)upd()}
const upd=()=>{$("#ds").textContent=money(ship());$("#tt").textContent=money(sub()+ship())};
function cq(k,d){cart[k].qty+=d;if(cart[k].qty<1)cart.splice(k,1);cc();cartOv()}
async function place(){const n=$("#cn").value.trim(),p=$("#cp").value.trim(),a=$("#ca").value.trim();if(!n||!/^[0-9+ -]{10,16}$/.test(p)||!a)return alert("Please enter name, valid mobile number and address");
const o={id:"EA"+Date.now().toString().slice(-7),date:new Date().toLocaleString(),n,p,a,area:ship()==+S.cfg.dOut?"Outside Dhaka":"Inside Dhaka",items:cart.slice(),sub:sub(),ship:ship(),total:sub()+ship(),st:"Pending"};try{const r=await api("place",o);o.id=r.id||o.id}catch(e){S.orders.unshift(o);save()}cart=[];cc();ov(`<button class=x onclick=cl()>✕</button><h3>Order placed ✓</h3><p>Thank you ${esc(n)}. Your order number is <b>${o.id}</b>. Keep this number to track your order. We will call you to confirm.</p><button class=btn onclick="trk()">Track order</button> <button class=btn onclick=go()>Continue shopping</button>`)}
function startHero(){clearInterval(T);const s=document.querySelectorAll(".sl"),d=document.querySelectorAll(".dots i");if(s.length<2)return;let i=0;T=setInterval(()=>{s[i].classList.remove("on");d[i].classList.remove("on");i=(i+1)%s.length;s[i].classList.add("on");d[i].classList.add("on")},Math.max(2,+S.cfg.speed||4)*1000)}
/* ADMIN */
const newP=()=>({id:"p"+Date.now(),n:"",cat:S.cats[0]?S.cats[0].id:"",p:0,o:0,q:10,col:"",szh:H,sz:SZ,d:"",imgs:[],rv:"",best:0,new:1});
const fl=(l,id,v,t)=>`<label>${l}</label><input id="${id}" type="${t||"text"}" value="${esc(v)}">`,ta=(l,id,v,r)=>`<label>${l}</label><textarea id="${id}" rows="${r||3}">${esc(v)}</textarea>`;
function rd(f,max,cb){const r=new FileReader;r.onload=()=>{const im=new Image;im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.78))};im.src=r.result};r.readAsDataURL(f)}
function grab(){if(!EP)return;["n","cat","p","o","q","col","szh","sz","d","rv"].forEach(k=>{const e=$("#f_"+k);if(e)EP[k]=e.value});["best","new"].forEach(k=>{const e=$("#f_"+k);if(e)EP[k]=e.checked?1:0})}
function pf(){return `<div class=bar><h3>${S.prods.some(x=>x.id==EP.id)?"Edit":"Add"} product</h3><button onclick="EP=null;render()">Cancel</button></div>${fl("Product name","f_n",EP.n)}<label>Collection</label><select id=f_cat>${S.cats.map(k=>`<option value="${k.id}" ${k.id==EP.cat?"selected":""}>${esc(k.n)}</option>`).join("")}</select>${fl("Regular price","f_p",EP.p,"number")}${fl("Offer price (0 = none)","f_o",EP.o,"number")}${fl("Quantity in stock","f_q",EP.q,"number")}${fl("Colors (comma separated)","f_col",EP.col)}${fl("Size table columns","f_szh",EP.szh)}${ta("Size rows: one per line, same order as columns, e.g. M,38,27,17,24","f_sz",EP.sz,5)}${ta("Description","f_d",EP.d,4)}${ta("Reviews: Name|Rating|Text per line","f_rv",EP.rv,3)}
<label><input type=checkbox id=f_best ${EP.best?"checked":""}> Best selling</label><label><input type=checkbox id=f_new ${EP.new?"checked":""}> New arrival</label><label>Images</label><div class=th>${EP.imgs.map((u,i)=>`<span><img src="${esc(u)}"><br><a onclick="grab();EP.imgs.splice(${i},1);render()">✕</a></span>`).join("")}</div><input type=file accept="image/*" multiple onchange="grab();[...this.files].forEach(f=>rd(f,700,u=>{EP.imgs.push(u);render()}))"><input id=iu placeholder="Or paste image URL"><button onclick="const v=$('#iu').value.trim();if(v){grab();EP.imgs.push(v);render()}">Add URL</button><br><br><button class=btn onclick=saveP()>Save product</button>`}
function saveP(){grab();if(!EP.n.trim())return alert("Enter a name");EP.p=+EP.p;EP.o=+EP.o;EP.q=+EP.q;const i=S.prods.findIndex(x=>x.id==EP.id);i<0?S.prods.unshift(EP):S.prods[i]=EP;save();EP=null;render()}
const ST=["Pending","Accepted","Confirmed","Dispatched","Declined"];
const SF=[["name","Brand name"],["wa","WhatsApp number (880…)"],["fb","Facebook page URL"],["ph","Phone"],["addr","Address"],["hrs","Work hours"],["dIn","Delivery inside Dhaka","number"],["dOut","Delivery outside Dhaka","number"],["speed","Hero change (seconds)","number"],["pin","Admin passcode"],["note","Checkout note"],["about","Footer about text"],["pt","Promo banner title"],["ps","Promo banner subtitle"],["vt","Video section title"],["vid","Video URL (autoplays, muted, loops)"]];
const A={dash(){const o=OL||S.orders,rv=o.filter(x=>x.st!="Declined").reduce((s,x)=>s+x.total,0);return `<div class=st><div><b>${o.length}</b>Orders</div><div><b>${o.filter(x=>x.st=="Pending").length}</b>Pending</div><div><b>${money(rv)}</b>Revenue</div><div><b>${S.prods.length}</b>Products</div><div><b>${S.vis}</b>Visits (this browser)</div><div><b>${(S.subs||[]).length}</b>Subscribers</div></div><h4>Traffic sources</h4>${Object.entries(S.ref).map(([k,v])=>`<p>${esc(k)}: ${v}</p>`).join("")||"<p>No data yet.</p>"}`},
prod(){if(EP)return pf();return `<div class=bar><h3>Products (${S.prods.length})</h3><button class=btn onclick="EP=newP();render()">+ Add</button></div>`+S.prods.map(p=>`<div class=li>${ph(p)}<div><b>${esc(p.n)}</b><small>${esc(cn(p.cat))} · ${money(pr(p))} · Qty ${p.q}</small></div><button onclick="EP=JSON.parse(JSON.stringify(S.prods.find(x=>x.id=='${p.id}')));render()">Edit</button><button onclick="if(confirm('Delete?')){S.prods=S.prods.filter(x=>x.id!='${p.id}');save();render()}">Del</button></div>`).join("")},
ord(){return `<h3>Orders (${(OL||S.orders).length})</h3><small>${OL?"Live orders from server":"Local orders (this browser only)"}</small>`+(OL||S.orders).map((o,i)=>`<div class=oc><b>${o.id}</b> · ${esc(o.date)}<br>${esc(o.n)} · ${esc(o.p)}<br>${esc(o.a)} (${o.area})<br>${o.items.map(x=>`${esc(x.n)} ${esc(x.size)} ${esc(x.color)} ×${x.qty}`).join("<br>")}<br><b>Total ${money(o.total)}</b> (delivery ${money(o.ship)})<select onchange="ost('${o.id}',this.value)">${ST.map(s=>`<option ${s==o.st?"selected":""}>${s}</option>`).join("")}</select><button onclick="odel('${o.id}')">Delete</button></div>`).join("")},
col(){return `<h3>Collections</h3>${S.cats.map((k,i)=>`<div class=li><input value="${esc(k.n)}" onchange="S.cats[${i}].n=this.value;save()"><button onclick="if(confirm('Remove collection?')){S.cats.splice(${i},1);save();render()}">Del</button></div>`).join("")}<input id=nc placeholder="New collection name"><button class=btn onclick="const n=$('#nc').value.trim();if(n){S.cats.push({id:'c'+Date.now(),n});save();render()}">Add collection</button>`},
home(){return `<h3>Hero slides</h3>${S.hero.map((h,i)=>`<div class=oc>${fl("Title","h_t"+i,h.t)}${fl("Subtitle","h_s"+i,h.s)}${fl("Image URL","h_i"+i,h.img.startsWith("data:")?"(uploaded)":h.img)}<input type=file accept="image/*" onchange="rd(this.files[0],1100,u=>{S.hero[${i}].img=u;save();render()})"><label>Links to</label><select id=h_c${i}>${["best","new"].concat(S.cats.map(k=>k.id)).map(id=>`<option value="${id}" ${id==h.cat?"selected":""}>${esc(ttl(id))}</option>`).join("")}</select><button onclick="S.hero.splice(${i},1);save();render()">Remove slide</button></div>`).join("")}<button onclick="S.hero.push({t:'New slide',s:'',img:'',cat:'new'});save();render()">+ Slide</button> <button class=btn onclick=saveH()>Save slides</button>`},
set(){const c=S.cfg;return `<h3>Settings</h3>${SF.map(f=>fl(f[1],"s_"+f[0],c[f[0]],f[2])).join("")}<label>Accent color</label><input id=s_ac type=color value="${c.ac}"><label>Highlight color</label><input id=s_ac2 type=color value="${c.ac2}"><label>Font</label><select id=s_font>${[["system-ui,sans-serif","Modern sans"],["Georgia,serif","Elegant serif"],["'Courier New',monospace","Mono"]].map(f=>`<option value="${f[0]}" ${f[0]==c.font?"selected":""}>${f[1]}</option>`).join("")}</select><button onclick=upV()>Upload video file</button><label><input type=checkbox id=s_anim ${c.anim?"checked":""}> Animations</label><label><input type=checkbox id=s_hover ${c.hover?"checked":""}> Hover effects</label><br><button class=btn onclick=saveS()>Save settings</button><h4>Backup</h4><textarea id=bk rows=4></textarea><button onclick="$('#bk').value=JSON.stringify(S)">Create backup</button> <button onclick="try{S=JSON.parse($('#bk').value);save();render()}catch(e){alert('Invalid backup')}">Restore</button>`}};
async function upV(){const a=window.claude&&await claude.use("assets");if(!a)return alert("Upload not available here. Paste a video URL instead.");const i=document.createElement("input");i.type="file";i.accept="video/*";i.onchange=async()=>{try{const r=await a.upload(i.files[0]);$("#s_vid").value=r.url;alert("Uploaded. Now press Save settings.")}catch(e){alert("Upload failed")}};i.click()}
function saveH(){S.hero.forEach((h,i)=>{h.t=$("#h_t"+i).value;h.s=$("#h_s"+i).value;h.cat=$("#h_c"+i).value;const u=$("#h_i"+i).value;if(u!="(uploaded)")h.img=u});save();render();alert("Saved")}
function saveS(){SF.forEach(f=>{const v=$("#s_"+f[0]).value;S.cfg[f[0]]=f[2]?+v:v});["ac","ac2","font"].forEach(k=>S.cfg[k]=$("#s_"+k).value);S.cfg.anim=$("#s_anim").checked?1:0;S.cfg.hover=$("#s_hover").checked?1:0;save();render();alert("Saved")}
function admin(){if(!authed)return `<div class=lg><h2>Admin login</h2><input id=pw type=password placeholder=Passcode><button class=btn onclick="if($('#pw').value==S.cfg.pin){authed=true;render();loadOrders()}else alert('Wrong passcode')">Enter</button><a onclick="location.hash=''">← Back to store</a></div>`;
return `<div class=ad><nav>${[["dash","Dashboard"],["prod","Products"],["ord","Orders"],["col","Collections"],["home","Homepage"],["set","Settings"]].map(t=>`<button class="${AT==t[0]?"on":""}" onclick="grab();AT='${t[0]}';EP=null;render();if(AT=='ord'||AT=='dash')loadOrders()">${t[1]}</button>`).join("")}<button onclick="location.hash=''">View store →</button></nav><main>${A[AT]()}</main></div>`}
function render(){clearInterval(T);const c=S.cfg,adm=location.hash=="#admin",r=document.documentElement.style;document.body.className=(c.anim?"an ":"")+(c.hover?"hv":"");r.setProperty("--ac",c.ac);r.setProperty("--ac2",c.ac2);r.setProperty("--f",c.font);document.title=c.name;
$("#app").innerHTML=adm?admin():head()+(V.c?colv():home())+foot()+bnav();if(!adm){startHero();document.querySelectorAll(".rv").forEach(e=>io.observe(e))}}
addEventListener("hashchange",()=>{cl();render()});
try{if(location.hash!="#admin"&&!sessionStorage.getItem("v")){sessionStorage.setItem("v",1);S.vis++;let h="Direct";try{h=new URL(document.referrer).hostname||"Direct"}catch(e){}S.ref[h]=(S.ref[h]||0)+1;save()}}catch(e){}
render();
</script></body></html>
