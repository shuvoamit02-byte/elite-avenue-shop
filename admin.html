<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELITE AVENUE BD - Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1, h2 { color: #d4af37; text-align: center; }
        .section { margin-bottom: 30px; padding: 15px; background: #2a2a2a; border-radius: 6px; }
        label { display: block; margin-top: 10px; color: #ccc; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; background: #333; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { background: #d4af37; color: #121212; padding: 10px 20px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; }
        button:hover { background: #e6c555; }
    </style>
</head>
<body>

<div class="container">
    <h1>Elite Avenue BD — Admin Panel</h1>
    
    <!-- ১. থিম ও কালার কন্ট্রোল -->
    <div class="section">
        <h2>Website Customization & Theme</h2>
        <label>Background Color:</label>
        <input type="color" id="bgColor" value="#121212">
        
        <label>Show Promo Banner:</label>
        <select id="showBanner">
            <option value="true">Enable</option>
            <option value="false">Disable</option>
        </select>
        
        <button onclick="saveSettings()">Save Settings</button>
    </div>

    <!-- ২. নতুন প্রোডাক্ট অ্যাড করার ফর্ম -->
    <div class="section">
        <h2>Add New Product</h2>
        <label>Product Name:</label>
        <input type="text" id="prodName" placeholder="Enter product name">
        
        <label>Price (BDT):</label>
        <input type="number" id="prodPrice" placeholder="Enter price">
        
        <label>Image URL:</label>
        <input type="text" id="prodImg" placeholder="Enter image link">
        
        <button onclick="addProduct()">Publish Product</button>
    </div>
</div>

<!-- Firebase Script & Logic -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // আপনার ফায়ারবেস কনফিগ
    const firebaseConfig = {
      apiKey: "AIzaSyBmd6TVKotzSMiUBATw8POCPj9Dc98ct4o",
      authDomain: "elite-avenue-shop.firebaseapp.com",
      projectId: "elite-avenue-shop",
      storageBucket: "elite-avenue-shop.firebasestorage.app",
      messagingSenderId: "929865281991",
      appId: "1:929865281991:web:2a4ce78b0e3106087369e2",
      measurementId: "G-3Q05BT20MF"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.saveSettings = async function() {
        const bgColor = document.getElementById("bgColor").value;
        const showBanner = document.getElementById("showBanner").value === "true";
        try {
            await setDoc(doc(db, "settings", "siteConfig"), { bgColor, showBanner, updatedAt: new Date() });
            alert("Settings Saved Successfully!");
        } catch (e) {
            alert("Error saving settings: " + e.message);
        }
    };

    window.addProduct = async function() {
        const name = document.getElementById("prodName").value;
        const price = document.getElementById("prodPrice").value;
        const image = document.getElementById("prodImg").value;
        
        if(!name || !price) {
            alert("Please fill in product name and price!");
            return;
        }

        try {
            await addDoc(collection(db, "products"), { name, price, image, createdAt: new Date() });
            alert("Product Added Successfully to Live Database!");
            document.getElementById("prodName").value = '';
            document.getElementById("prodPrice").value = '';
            document.getElementById("prodImg").value = '';
        } catch (e) {
            alert("Error adding product: " + e.message);
        }
    };
</script>

</body>
</html>
